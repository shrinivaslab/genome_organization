# MaxEnt combined TKL and IC loop configuration
# This config optimizes both epsilon (type-type interactions) and lambda_IC (ideal chromosome force) simultaneously.
# Edit values as needed, but do not change keys.

# SLURM settings (global defaults; can be overridden per-stage in `resources`)
slurm:
  account: "p32733"
  partition: "short"          # default partition for processing/update jobs
  time_limit: "4:00:00"
  cpus_per_task: 7
  mem: "25G"
  constraint: null
  qos: null

# Simulation settings (model + loop constants)
simulation:
  n_replicates: 50          # logical number of replicates per iteration
  frames: 4000              # frames per replicate
  burnin_frames: 400        # cold-start frames to discard in analysis
  save_frames: true         # if your runner supports streaming, set false to minimize I/O
  seeds_base: 177013        # derive 50 fixed seeds from this base
  n_types: 5                # number of chromatin types (K)                  # total number of monomers in the system
  density: 0.33             # density for box length calculation
  N: 24675                   # total number of monomers in the system
  chains:                   # chain definitions [(start, end, is_ring), ...]
    - [0, 1955, false]      # chromosome 1
    - [1955, 3780, false]      # chromosome 2
    - [3780, 5385, false]      # chromosome 3
    - [5385, 6955, false]      # chromosome 4
    - [6955, 8475, false]      # chromosome 5
    - [8475, 9975, false]      # chromosome 6
    - [9975, 11430, false]      # chromosome 7
    - [11430, 12725, false]      # chromosome 8
    - [12725, 13975, false]      # chromosome 9
    - [13975, 15285, false]      # chromosome 10
    - [15285, 16510, false]      # chromosome 11
    - [16510, 17715, false]      # chromosome 12
    - [17715, 18920, false]      # chromosome 13
    - [18920, 20170, false]      # chromosome 14
    - [20170, 21215, false]      # chromosome 15
    - [21215, 22200, false]      # chromosome 16
    - [22200, 23150, false]      # chromosome 17
    - [23150, 24060, false]      # chromosome 18
    - [24060, 24675, false]      # chromosome 19
  initialization_method: "territory_rw"  # "random_walk" or "grow_cubic" or "territory_rw"

# Ideal Chromosome (IC) specific settings
ideal_chromosome:
  d_init: 3          # minimum genomic distance (bins)
  d_end: 300         # maximum genomic distance (bins)
  # dmax = d_end - d_init = 297

# Force parameters (optional, uses defaults if not specified)
# Customize force parameters here; omit any force to use defaults from run_replicates_array.py
force_kwargs:
  harmonic_bonds:
    bondWiggleDistance: 0.10  # (σ units)
    bondLength: 1.0
  angle_force:
    k: 2.0                    # in kT/rad^2
    theta_0: 3.141592653589793  # np.pi
  spherical_confinement:
    r: "density"
    density: 0.10
    k: 1.5                    # softer than 5.0
    center: [0.0, 0.0, 0.0]
    invert: false
    particles: null
    name: "spherical_confinement"
  polynomial_repulsive:
    trunc: 3                  # energy cap at r→0 in kT
    radiusMult: 1
    name: "polynomial_repulsive"

# Learning-rate & update
update:
  eta_init: 1.0e-3
  eta_min: 1.0e-6
  eta_max: 5.0e-1
  precond_eps: 1.0e-8
  bb_clip_fraction: 0.25
  max_lambda_step_size: 0.1  # Maximum allowed step size per parameter (applies to both epsilon and lambda_IC)
  gradient_normalization: "L2"  # Normalization method for joint gradients: "L2" (L2 norm) or null/not specified for no normalization

# Convergence (stop if true for N consecutive iterations)
# Note: Both epsilon and lambda_IC must converge for the loop to stop
convergence:
  max_abs_residual: 1.0e-3
  l2_residual: 5.0e-3
  max_param_step: 1.0e-4
  consecutive: 2

# Inputs processing script expects:
processing_inputs:
  # Required: monomer types assignment
  monomer_types: "/home/pkv4601/genome_architecture/chunkchromatin/Megaenhancers/sim_params/ME_bed_types_chr1_to_chr19.npy"
  
  # Required: TKL experimental observable
  exp_tkl: "/projects/p32733/ME/experimental_data/all_chroms_500mb_Tkl_exp_interpolated.npy"
  
  # Required: IC experimental observable
  exp_phi_IC: "/projects/p32733/ME/experimental_data/IC_exp_all_chrom.npy"
  
  # Required: Initial epsilon (K×K matrix) for type-type interactions
  # Best TKL loss: iter_012 (max_abs: 36.76, l2: 51.29)
  epsilon_init: "/projects/p32733/ME/maxent/retraining_different_priors/maxent_retraining/IC_term/tkl_IC_opt_L2_chr4/iter_023/update/epsilon_tk_23.npy"
  
  # Optional: Initial lambda_IC (dmax vector). If not provided, starts from zeros
  # Best IC loss: iter_000 (max_abs: 0.112, l2: 0.267)
  lambda_IC_init: "/projects/p32733/ME/maxent/retraining_different_priors/maxent_retraining/IC_term/tkl_IC_opt_L2_chr4/iter_023/update/lambda_IC_tk_23.npy"
  
  # Optional: resolution for observables ("500kb" for monomer-resolution, null for type-averaged)
  resolution: "500kb"
  
  # Optional: kernel parameters for observable computation
  kernel_flags:
    mu:   4.22
    rc:   1.82
    rcut: 3.0
    beta: 1.0

# Experimental target files (copied to run_root/exp_targets/ during initialization)
exp_targets:
  # Required: TKL experimental targets
  T_type_kl_npy: "/projects/p32733/ME/experimental_data/all_chroms_500mb_Tkl_exp_interpolated.npy"
  
  # Required: IC experimental targets
  phi_exp_IC_npy: "/projects/p32733/ME/experimental_data/IC_exp_all_chrom.npy"

# ------------------------------
# stage-specific resources
# ------------------------------
resources:
  simulation:
    array_len: 8               # Number of array jobs (adjust based on n_replicates and per_task_replicates)
    per_task_replicates: 7    # Replicates per array task (array_len * per_task_replicates >= n_replicates)
    time_limit: "4:00:00"
    cpus_per_task: 1
    mem: "5G"
    # GPU-specific settings for simulation jobs
    partition: "gengpu"        # override global partition for simulations
    gres: "gpu:a100:1"         # GPU resource allocation

  processing:
    workers:
      array_len: 8             # Number of processing worker jobs
      time_limit: "4:00:00"
      cpus_per_task: 7
      mem: "25G"
      io_k: 2                  # exported as MAXENT_IO_K and passed as --io-k
    reduce:
      time_limit: "0:30:00"
      cpus_per_task: 1
      mem: "4G"
      # Optional: custom directories for parameter outputs (defaults to {iter_dir}/update)
      epsilon_dir: null
      lambda_dir: null

