# MaxEnt loop configuration
# Edit values as needed, but do not change keys.

# SLURM settings (global defaults; can be overridden per-stage in `resources`)
slurm:
  account: "p32733"
  partition: "short"          # default partition for processing/update jobs
  time_limit: "4:00:00"
  cpus_per_task: 7
  mem: "25G"
  constraint: null
  qos: null

# Simulation settings (model + loop constants)
simulation:
  n_replicates: 50          # logical number of replicates per iteration
  frames: 4000              # frames per replicate
  burnin_frames: 400        # cold-start frames to discard in analysis
  save_frames: true         # if your runner supports streaming, set false to minimize I/O
  seeds_base: 177013        # derive 50 fixed seeds from this base
  n_types: 5                # number of chromatin types (K)
  N: 24675                   # total number of monomers in the system
  density: 0.33             # density for box length calculation
  chains:                   # chain definitions [(start, end, is_ring), ...]
    - [0, 1955, false]      # chromosome 1
    - [1955, 3780, false]      # chromosome 2
    - [3780, 5385, false]      # chromosome 3
    - [5385, 6955, false]      # chromosome 4
    - [6955, 8475, false]      # chromosome 5
    - [8475, 9975, false]      # chromosome 6
    - [9975, 11430, false]      # chromosome 7
    - [11430, 12725, false]      # chromosome 8
    - [12725, 13975, false]      # chromosome 9
    - [13975, 15285, false]      # chromosome 10
    - [15285, 16510, false]      # chromosome 11
    - [16510, 17715, false]      # chromosome 12
    - [17715, 18920, false]      # chromosome 13
    - [18920, 20170, false]      # chromosome 14
    - [20170, 21215, false]      # chromosome 15
    - [21215, 22200, false]      # chromosome 16
    - [22200, 23150, false]      # chromosome 17
    - [23150, 24060, false]      # chromosome 18
    - [24060, 24675, false]      # chromosome 19

# Learning-rate & update
update:
  eta_init: 1.0e-3
  eta_min: 1.0e-6
  eta_max: 5.0e-1
  precond_eps: 1.0e-8
  bb_clip_fraction: 0.25

# Convergence (stop if true for N consecutive iterations)
convergence:
  max_abs_residual: 1.0e-3
  l2_residual: 5.0e-3
  max_param_step: 1.0e-7
  consecutive: 2

# Paths to project scripts
# Note: run_replicates_array and process_tkl_update are now automatically 
# resolved from the bin/ directory and no longer need to be specified here
#paths:

# Inputs processing script expects:
processing_inputs:
  monomer_types: "/gpfs/home/pkv4601/genome_architecture/chunkchromatin/Megaenhancers/sim_params/ME_bed_types_chr4.npy"
  exp_tkl:       "/gpfs/home/pkv4601/genome_architecture/chunkchromatin/Megaenhancers/sim_params/Tkl_exp_interpolated_chr4.npy"
  interaction_matrix: "/gpfs/home/pkv4601/genome_architecture/chunkchromatin/Megaenhancers/sim_params/interaction_matrix.npy"

  # Optional: if you want process_tkl_update.py to read kernel numbers,
  # you can set them here; leave empty to skip flags and let your script
  # read a kernel.json if it supports that.
  kernel_flags:
    mu:   4.22
    rc:   1.82
    rcut: 3.0
    beta: 1.0

# Pinned kernel and experimental target vector
exp_targets:
  kernel_json: "/gpfs/home/pkv4601/genome_architecture/github/genome_organization/src/chunkchromatin/maxent_loop/exp_targets/kernel.json"
  T_type_kl_npy: "/gpfs/home/pkv4601/genome_architecture/chunkchromatin/Megaenhancers/sim_params/Tkl_exp_interpolated.npy"

# ------------------------------
# stage-specific resources
# ------------------------------
resources:
  simulation:
    array_len: 5
    per_task_replicates: 10
    time_limit: "4:00:00"
    cpus_per_task: 1
    mem: "5G"
    # GPU-specific settings for simulation jobs
    partition: "gengpu"        # override global partition for simulations
    gres: "gpu:a100:1"         # GPU resource allocation

  processing:
    workers:
      array_len: 8
      time_limit: "4:00:00"
      cpus_per_task: 7
      mem: "25G"
      io_k: 2         # exported as MAXENT_IO_K and passed as --io-k
    reduce:
      time_limit: "0:30:00"
      cpus_per_task: 1
      mem: "4G"
      # Where to write updated parameters if your reducer does that;
      # if omitted, we default to {iter_dir}/update
      alpha_dir: null

